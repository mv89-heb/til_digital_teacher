name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: til_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d til_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_ENV: testing
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/til_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Alembic graph
        run: flask --app run.py db heads
      - name: Apply all migrations on PostgreSQL
        run: flask --app run.py db upgrade
      - name: Verify migration state
        run: flask --app run.py db current
      - name: Run backend tests
        run: pytest -q
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate patched frontend lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
        working-directory: frontend
      - name: Upload patched frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-frontend-lockfile
          path: frontend/package-lock.json
      - name: Commit generated lockfile to the dependency PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/update-frontend-dependencies'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh frontend package lock"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Report frontend dependency advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(`[${item.severity}] ${name} | range: ${item.range} | fix: ${JSON.stringify(item.fixAvailable)}`);
              for (const advisory of item.via || []) {
                if (typeof advisory === "object") console.log(`  - ${advisory.title} | ${advisory.url}`);
              }
            }
            console.log("Audit summary:", JSON.stringify(report.metadata?.vulnerabilities || {}));
          '
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://til-digital-teacher-0ryl.onrender.com/api
        run: npm run build
