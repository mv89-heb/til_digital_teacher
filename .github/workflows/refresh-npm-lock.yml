name: Refresh npm lockfile

on:
  push:
    branches: ["fix/security-hardening-oct-2026"]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'Refresh npm lockfile')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh lockfile from audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Refresh npm lockfile"
          git push
