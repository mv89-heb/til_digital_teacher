name: Refresh npm lockfile

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/security-hardening-oct-2026'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh lockfile from audit fixes
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts && node -e "const l=require('./package-lock.json'); console.log('LOCK', l.packages['node_modules/next']?.version, l.packages['node_modules/vitest']?.version, l.packages['node_modules/@vitest/mocker']?.version);"
      - name: Commit lockfile if changed
        run: |
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh npm lockfile"
          git push
